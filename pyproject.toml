[project]
name = "aitrap"
version = "0.1.0"
description = "Non-stopping runtime traps for live AI agent processes - so an AI can read real values without freezing the agent it is debugging"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
aitrap = "aitrap.cli:main"
aitrap-mcp = "aitrap.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aitrap"]
