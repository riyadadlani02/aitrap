<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Checkout</title>
<style>
  :root{
    --bg:#f2f3f7; --card:#fff; --ink:#161a22; --dim:#6b7280; --line:#e6e8ef;
    --brand:#3d4fd6; --good:#0f9d6b; --bad:#d23b4e;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);
       padding-bottom:96px}
  header{padding:16px 18px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.02em}
  header p{margin:3px 0 0;color:var(--dim);font-size:13px}
  section{background:var(--card);margin:10px 0;padding:15px 18px;border-top:1px solid var(--line);
          border-bottom:1px solid var(--line)}
  h2{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--dim);display:flex;
     justify-content:space-between;align-items:center}
  .pill{background:#eceefb;color:var(--brand);border-radius:20px;padding:3px 9px;font-size:11px;
        font-weight:600}
  .item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
        border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item b{display:block;font-weight:550;font-size:14px}
  .item small{color:var(--dim);font-size:12px}
  .item span{font-variant-numeric:tabular-nums;font-weight:550;white-space:nowrap}

  .coupon{display:flex;gap:8px}
  input[type=text]{flex:1;min-width:0;padding:12px 13px;border:1px solid var(--line);
    border-radius:9px;font:15px var(--sans);background:#fbfbfd}
  input[type=text]:focus{outline:none;border-color:var(--brand);background:#fff}
  button{border:0;border-radius:9px;padding:12px 18px;font:600 15px var(--sans);
         background:var(--brand);color:#fff}
  button:active{transform:scale(.98)}
  .chips{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fbfbfd;border-radius:20px;padding:5px 11px;
        font-size:12px;color:var(--dim)}
  .chip.on{background:#eceefb;border-color:#c9cff5;color:var(--brand);font-weight:600}
  .msg{margin-top:10px;padding:9px 12px;border-radius:8px;font-size:13px;display:none}
  .msg.err{display:block;background:#fdeaec;color:var(--bad)}
  .msg.ok{display:block;background:#e6f6ef;color:var(--good)}

  .row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px}
  .row span:last-child{font-variant-numeric:tabular-nums}
  .row.muted span:first-child{color:var(--dim)}
  .row .off{color:var(--good)}
  .row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;
             font-size:16px;font-weight:650}
  .row.total span:last-child{color:var(--brand)}

  .toggle{display:flex;justify-content:space-between;align-items:center;gap:14px}
  .toggle p{margin:2px 0 0;color:var(--dim);font-size:12px}
  .sw{width:50px;height:30px;border-radius:20px;background:#d5d8e3;position:relative;
      flex:none;transition:background .18s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
             background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
  .sw.on{background:var(--brand)}
  .sw.on::after{transform:translateX(20px)}

  footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);
         border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));
         display:flex;justify-content:space-between;align-items:center;gap:14px}
  footer small{display:block;color:var(--dim);font-size:12px}
  footer b{font-size:22px;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}
</style>

<header>
  <h1>Checkout</h1>
  <p>Review your items and complete your order</p>
</header>

<section>
  <h2>Order Items <span class="pill" id="count">3 items</span></h2>
  <div id="items"></div>
</section>

<section>
  <h2>Promo &amp; Discounts</h2>
  <div class="coupon">
    <input type="text" id="code" placeholder="Enter coupon code" value="TECH15"
           autocapitalize="characters" autocomplete="off" spellcheck="false">
    <button id="apply">Apply</button>
  </div>
  <div class="chips">
    <span class="chip on">TECH15 (15% off $600+)</span>
    <span class="chip">AUDIO20 (20% off)</span>
  </div>
  <div class="msg" id="msg"></div>
</section>

<section>
  <div class="toggle">
    <div>
      <b>Express 2-Day Shipping</b>
      <p>Free on orders over $600 (standard: $25.00)</p>
    </div>
    <div class="sw on" id="express"></div>
  </div>
</section>

<section>
  <h2>Payment Summary</h2>
  <div id="summary"></div>
</section>

<footer>
  <div><small>Total Due</small><b id="total">$0.00</b></div>
  <button id="place">Place Order</button>
</footer>

<script>
const $ = id => document.getElementById(id);
const money = n => '$' + Number(n).toFixed(2);
let express = true;

$('express').onclick = () => { express = !express; $('express').classList.toggle('on', express); refresh(); };
$('apply').onclick = refresh;
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') refresh(); });
$('place').onclick = () => { $('place').textContent = 'Placing…';
  setTimeout(() => ($('place').textContent = 'Place Order'), 1200); };

async function refresh(){
  const code = $('code').value.trim();
  const r = await fetch(`/checkout?coupon=${encodeURIComponent(code)}&express=${express ? 1 : 0}`)
                  .then(r => r.json());
  if (r.error){ $('msg').className = 'msg err'; $('msg').textContent = r.error; return; }

  $('count').textContent = `${r.items.length} items`;
  $('items').innerHTML = r.items.map(i => `
    <div class="item"><div><b>${i.name}</b><small>${i.cat} · Qty ${i.qty}</small></div>
      <span>${money(i.price * i.qty)}</span></div>`).join('');

  $('msg').className = 'msg ' + (r.promoError ? 'err' : (r.promoDiscount ? 'ok' : ''));
  $('msg').textContent = r.promoError || (r.promoDiscount ? `Coupon applied — ${money(r.promoDiscount)} off` : '');

  $('summary').innerHTML = `
    <div class="row muted"><span>Gross Subtotal</span><span>${money(r.grossSubtotal)}</span></div>
    <div class="row muted"><span>Member Discount (${r.tier} Tier)</span><span class="off">−${money(r.memberDiscount)}</span></div>
    <div class="row muted"><span>Promo Discount${r.promoDiscount ? '' : ' (None)'}</span><span class="${r.promoDiscount ? 'off' : ''}">${r.promoDiscount ? '−' + money(r.promoDiscount) : money(0)}</span></div>
    <div class="row muted"><span>Estimated Tax (8.5%)</span><span>${money(r.tax)}</span></div>
    <div class="row muted"><span>Shipping</span><span>${money(r.shipping)}</span></div>
    <div class="row total"><span>Total Amount Due</span><span>${money(r.total)}</span></div>`;
  $('total').textContent = money(r.total);
}
refresh();
</script>
